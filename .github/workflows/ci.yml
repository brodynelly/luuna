name: Luuna foundation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
  frontend-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/check-hygiene.mjs
      - run: npm run typecheck
      - run: npm run build
  terminal-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: target/debug/luuna-runtime.exe
          - os: ubuntu-latest
            runtime: target/debug/luuna-runtime
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci --ignore-scripts
      - run: npm run components:setup
      - run: npm run build --workspace @luuna/api-client
      - run: cargo build --locked -p luuna-runtime -p luuna-tui
      - run: npm run test:tui-terminal
      - run: node scripts/tui-interactive-audit.mjs --runtime "${{ matrix.runtime }}" --components-root . --out "${{ runner.temp }}/luuna-native-audit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-native-${{ runner.os }}
          path: |
            ${{ runner.temp }}/luuna-native-audit/report.json
            ${{ runner.temp }}/luuna-native-audit/report.md
            ${{ runner.temp }}/luuna-native-audit/captures/
  components:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: node scripts/components.mjs setup
      - run: node scripts/components.mjs verify
      - run: node scripts/components-smoke.mjs
  desktop-native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
