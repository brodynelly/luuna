[package]
name = "luuna-desktop"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Desktop-only window plugins (ADR 0039). Rust-only: no JavaScript API and no capability permission.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-window-state = "=2.5.0"

[workspace]
