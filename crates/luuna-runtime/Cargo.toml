[package]
name = "luuna-runtime"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
luuna-domain = { path = "../luuna-domain" }
luuna-storage = { path = "../luuna-storage" }
luuna-engine-pi = { path = "../luuna-engine-pi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "limit"] }
async-stream = "0.3"
uuid = { version = "1", features = ["v4"] }
constant_time_eq = "0.4"
fs2 = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
