[package]
name = "luuna-git"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true

[dependencies]
luuna-domain = { path = "../luuna-domain" }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
thiserror = "2.0.17"
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.23.0"
serde_json = "1.0.145"
