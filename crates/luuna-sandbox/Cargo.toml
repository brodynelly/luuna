[package]
name = "luuna-sandbox"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true

[[bin]]
name = "luuna-sbx"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.23.0"
