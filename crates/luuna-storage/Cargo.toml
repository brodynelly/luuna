[package]
name = "luuna-storage"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true

[dependencies]
luuna-domain = { path = "../luuna-domain" }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

[dev-dependencies]
tempfile = "3.23.0"
