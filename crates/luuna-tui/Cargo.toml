[package]
name = "luuna-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = "=0.28.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "signal", "net"] }
unicode-width = "=0.2.0"

[dev-dependencies]
tempfile = "3.23.0"
portable-pty = "=0.9.0"
axum = "0.8"
