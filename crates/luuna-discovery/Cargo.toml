[package]
name = "luuna-discovery"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true

[dependencies]
luuna-domain = { path = "../luuna-domain" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

[dev-dependencies]
tempfile = "3.23.0"
